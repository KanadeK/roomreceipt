name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - run: uv run python scripts/build_site.py --output .site-build
      - run: uv run python scripts/site_check.py .site-build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .site-build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
